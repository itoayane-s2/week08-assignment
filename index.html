<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバー紹介</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-6">チームメンバー</h1>
    <div id="memberList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6"></div>
        <!-- メンバー情報がここに追加されます -->
    
    
    <script>
        const members = [
            { name: "田中太郎", role: "デザイナー", description: "UIにこだわっています" },
            { name: "鈴木花子", role: "エンジニア", description: "コードを書くのが好きです" },
            { name: "佐藤次郎", role: "プロジェクトマネージャー", description: "チームをまとめるのが得意です" },
            { name: "山田花子", role: "デザイナー", description: "色選びが得意です" },
            { name: "高橋一郎", role: "エンジニア", description: "要件定義が得意です" }
        ];

        const memberList = document.getElementById('memberList');

        members.forEach(member => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-lg shadow p-4 w-60";
            card.innerHTML = `
                <h2 class="text-lg font-bold">${member.name}</h2>
                <p class="text-blue-600 mt-2">${member.role}</p>
                <p class="text-gray-600 mt-2">${member.description}</p>
            `;
            memberList.appendChild(card);
        });
    </script>

    
</body>
</html>
